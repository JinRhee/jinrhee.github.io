{% include base_path %}

<!-- MapMyVisitors counter; main.scss hides the map and shows only the count -->
<div class="page__footer-copyright visits">
  <script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d=wmOJAsL5hAscKdznvxl1bMgFf5r0xW6kgyds_UmSQK0&cl=ffffff&w=a"></script>
</div>
<script>
  /* The count arrives ~1–2 s after load; show it only once it has a number.
     Block comment, not //: production builds squash the page onto one line. */
  const visits = document.querySelector('.visits');
  new MutationObserver((_, observer) => {
    const count = visits.querySelector('.mapmyvisitors-visitors');
    if (count && /\d/.test(count.textContent)) {
      visits.classList.add('ready');
      observer.disconnect();
    }
  }).observe(visits, { childList: true, subtree: true, characterData: true });
</script>

<!-- site.time is the build time; GitHub Pages rebuilds on every push, so it tracks the last update -->
<div class="page__footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} · Last updated {{ site.time | date: '%b %-d, %Y' }}</div>
